name: CI Tests

# 実行するタイミング
# 特定のブランチにのみ反応させる場合は branches を指定する
on:
  push:
  pull_request:

# 実際にテストを実行させる
jobs:
  test:
    # 実行する環境
    # ubuntu-latest ランナーには Docker が標準搭載されているため、task-lab-infrastructure:test や integrationTest が使う Testcontainers はそのまま動く（追加セットアップ不要）
    # gradle/actions/setup-gradle@v4 が Gradle の依存関係キャッシュを自動で行うので、キャッシュ設定を別途書く必要はない
    runs-on: ubuntu-latest
    steps:
      # GitHub Actions のランナーは、ジョブ開始時点では空の仮想マシンで、リポジトリのコードは自動では置かれていません。
      # このステップがリポジトリの中身（このケースでは main や PR のブランチ）をランナー上にクローンして配置します。
      # これがないと後続の ./gradlew build などが実行するソースコードが存在せず失敗します。
      - name: Checkout
        uses: actions/checkout@v4

      # 実行するためのJava環境を用意
      # ランナー上に Java 17（distribution: temurin = Eclipse Temurin ディストリビューション）をインストールし、JAVA_HOME や PATH を設定するステップです。
      # Kotlin/Gradle のビルドには JVM が必要ですが、ランナーに標準で入っている Javaのバージョンは前提にできないため、明示的にインストールします。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 依存関係（~/.gradle/caches/modules-2）、Gradle 本体のダウンロード（wrapper）、ビルドキャッシュが自動でキャッシュされるようにセットアップするステップです。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # task-lab-core:test / task-lab-infrastructure:test / task-lab-api:test がまとめて実行される
      - name: Run unit tests
        run: ./gradlew build

      - name: Run integration tests
        run: ./gradlew :task-lab-api:integrationTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
