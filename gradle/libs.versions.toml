[versions]   # バージョン番号だけを定義。他セクションから version.ref で参照される
# 単なる文字列テーブルです。
# ここに書いた名前を他セクションから version.ref = "kotlin" で参照します。
# 同じバージョンを共有するもの（Kotlin 本体と Kotlin Spring プラグインなど）を1つに束ねるのが主用途です。

kotlin = "2.3.21"
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"

[plugins]    # Gradle プラグインの定義
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]  # ライブラリ（group:artifact）の定義
# 書き方が以下の3通り存在する。
# (a) version.ref で [versions] を参照
# kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# (b) その場に直接バージョンを書く（1箇所でしか使わないもの）
# mockk = { module = "io.mockk:mockk", version = "1.13.13" }

# (c) バージョンを書かない ← BOM がバージョンを管理している場合はこれ
# spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }

# 以下のバージョンはすべて Spring Boot BOM が管理しているため version は書かない
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }

# task-lab-core 用。core は BOM を適用していないので方式 (b) でバージョンを直書きする。
# （Boot 4.1.0 の BOM も jakarta-inject.version = 2.0.1 なので値は揃っている）
jakarta-inject-api = { module = "jakarta.inject:jakarta.inject-api", version = "2.0.1" }

[bundles]    # 複数ライブラリのグループ化。1行でまとめて依存追加できる
